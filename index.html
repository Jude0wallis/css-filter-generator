<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSS Filter Generator</title>
<style>
body{font-family:Arial;background:#f1f5f9;padding:25px}
main{max-width:650px;margin:auto;background:white;padding:25px;border-radius:15px}
label{display:block;margin:15px 0 5px}
input{width:100%}
#preview{height:220px;display:grid;place-items:center;font-size:75px;background:linear-gradient(135deg,#38bdf8,#facc15,#f472b6);border-radius:12px;margin:25px 0}
pre{background:#1e293b;color:#86efac;padding:15px;white-space:pre-wrap;border-radius:8px}
button{padding:12px 18px;background:#2563eb;color:white;border:0;border-radius:7px;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>CSS Filter Generator</h1>

<label>Brightness: <span id="brightnessValue">100</span>%</label>
<input id="brightness" type="range" min="0" max="200" value="100">

<label>Contrast: <span id="contrastValue">100</span>%</label>
<input id="contrast" type="range" min="0" max="200" value="100">

<label>Saturation: <span id="saturateValue">100</span>%</label>
<input id="saturate" type="range" min="0" max="200" value="100">

<label>Grayscale: <span id="grayscaleValue">0</span>%</label>
<input id="grayscale" type="range" min="0" max="100" value="0">

<label>Sepia: <span id="sepiaValue">0</span>%</label>
<input id="sepia" type="range" min="0" max="100" value="0">

<label>Blur: <span id="blurValue">0</span>px</label>
<input id="blur" type="range" min="0" max="20" value="0">

<div id="preview">🌄</div>
<h3>Generated CSS</h3>
<pre id="code"></pre>
<button onclick="copyCSS()">Copy CSS</button>
<button onclick="reset()">Reset Filters</button>
<p id="status"></p>
</main>
<script>
const names=["brightness","contrast","saturate","grayscale","sepia","blur"];

function update(){
 const values={};
 names.forEach(name=>{
  const value=document.getElementById(name).value;
  values[name]=value;
  document.getElementById(name+"Value").textContent=value;
 });

 const css=`filter: brightness(${values.brightness}%) contrast(${values.contrast}%) saturate(${values.saturate}%) grayscale(${values.grayscale}%) sepia(${values.sepia}%) blur(${values.blur}px);`;

 document.getElementById("preview").style.filter=css.replace("filter: ","").replace(";","");
 document.getElementById("code").textContent=css;
}
names.forEach(name=>{
 document.getElementById(name).addEventListener("input",update);
});
async function copyCSS(){
 try{
  await navigator.clipboard.writeText(document.getElementById("code").textContent);
  document.getElementById("status").textContent="CSS copied successfully!";
 }catch{
  document.getElementById("status").textContent="Copy the CSS manually.";
 }
}
function reset(){
 names.forEach(name=>{
  document.getElementById(name).value=
  name==="brightness"||name==="contrast"||name==="saturate"?100:0;
 });
 update();
 document.getElementById("status").textContent="Filters reset.";
}
update();
</script>
</body>
</html>
