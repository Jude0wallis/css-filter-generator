<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Filter Generator</title>
<style>
body{font-family:Arial;background:#f5f3ff;padding:25px}
main{max-width:650px;margin:auto;background:white;padding:30px;border-radius:16px}
input[type=range]{width:100%;margin:10px 0}
label{display:block;margin-top:12px}
#preview{width:100%;max-height:300px;object-fit:contain;margin:20px 0;border-radius:10px}
button{background:#7c3aed;color:white;border:0;padding:12px 20px;border-radius:8px;cursor:pointer}
#code{background:#ede9fe;padding:15px;border-radius:8px;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>CSS Filter Generator</h1>
<p>Experiment with custom image filters.</p>
<input id="file" type="file" accept="image/*">
<img id="preview" alt="Filter preview" hidden>
<label>Brightness</label>
<input id="brightness" type="range" min="0" max="200" value="100" oninput="update()">
<label>Contrast</label>
<input id="contrast" type="range" min="0" max="200" value="100" oninput="update()">
<label>Saturation</label>
<input id="saturation" type="range" min="0" max="200" value="100" oninput="update()">
<label>Blur</label>
<input id="blur" type="range" min="0" max="15" value="0" oninput="update()">
<p id="code"></p>
<button onclick="copyCode()">Copy CSS</button>
<p id="status"></p>
</main>
<script>
let url=null;
document.getElementById("file").onchange=function(){
 const file=this.files[0];
 if(!file)return;
 if(url)URL.revokeObjectURL(url);
 url=URL.createObjectURL(file);
 const image=document.getElementById("preview");
 image.onload=()=>image.hidden=false;
 image.onerror=()=>{
  image.hidden=true;
  document.getElementById("status").textContent="Invalid image.";
 };
 image.src=url;
};
function update(){
 const value=id=>document.getElementById(id).value;
 const filter="brightness("+value("brightness")+"%) "+
 "contrast("+value("contrast")+"%) "+
 "saturate("+value("saturation")+"%) "+
 "blur("+value("blur")+"px)";
 document.getElementById("preview").style.filter=filter;
 document.getElementById("code").textContent="filter: "+filter+";";
 document.getElementById("status").textContent="";
}
async function copyCode(){
 try{
  await navigator.clipboard.writeText(document.getElementById("code").textContent);
  document.getElementById("status").textContent="CSS copied!";
 }catch{
  document.getElementById("status").textContent="Please copy manually.";
 }
}
update();
</script>
</body>
</html>
